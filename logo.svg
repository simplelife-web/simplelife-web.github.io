<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Simplelife">
  <style>
    .hoja { transform-origin: 30px 60px; animation: mecer 3.2s ease-in-out infinite; }
    .ojos { transform-origin: 31px 28px; animation: parpadear 4.5s infinite; }
    @keyframes mecer { 0%, 100% { transform: rotate(-7deg); } 50% { transform: rotate(7deg); } }
    @keyframes parpadear { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
    @media (prefers-reduced-motion: reduce) { .hoja, .ojos { animation: none; } }
  </style>
  <g class="hoja">
    <path d="M30 60 C30 56 30.5 52 31.5 48" stroke="#2f7a4f" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M31 49 C14 47 6 32 12 20 C18 9 36 5 55 5 C58 20 56 34 48 42 C43 47 37 49 31 49 Z" fill="#5cbf7a"/>
    <path d="M31 49 C14 47 6 32 12 20 C18 9 36 5 55 5 C42 12 30 24 31 49 Z" fill="#4fae6c"/>
    <path d="M31.5 48 C33 34 40 18 54 6" stroke="#3a9459" stroke-width="1.8" stroke-linecap="round" fill="none" opacity=".8"/>
    <g class="ojos">
      <ellipse cx="24" cy="29" rx="2.4" ry="3" fill="#1d3b2a"/>
      <ellipse cx="38" cy="27" rx="2.4" ry="3" fill="#1d3b2a"/>
      <circle cx="24.8" cy="28" r=".8" fill="#fff"/>
      <circle cx="38.8" cy="26" r=".8" fill="#fff"/>
    </g>
    <circle cx="19.5" cy="35" r="2.2" fill="#f29a9a" opacity=".7"/>
    <circle cx="43" cy="32" r="2.2" fill="#f29a9a" opacity=".7"/>
    <path d="M27 35 Q31 38.5 35 34" stroke="#1d3b2a" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  </g>
</svg>

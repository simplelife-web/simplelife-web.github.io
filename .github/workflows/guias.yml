# Robot de las guías «Economía peruana en simple»: cada mañana baja los datos
# oficiales del BCRP, rehace los gráficos y publica solo las guías cuya fecha de
# publicación ya llegó (así salen de a poco, dos o tres por semana, sin que
# tengas que hacer nada). También pone la guía nueva en «Novedades» de la portada
# y en el sitemap. Es gratis.
# Para lanzarlo a mano: pestaña Actions → "Robot guías de economía" → Run workflow.
name: Robot guías de economía

on:
  schedule:
    - cron: "15 11 * * *"   # 6:15 a. m. de Lima, todos los días
  workflow_dispatch:
  push:
    paths:
      - .github/guias/**
      - .github/workflows/guias.yml

permissions:
  contents: write

concurrency:
  group: robot-guias
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: America/Lima
    steps:
      - uses: actions/checkout@v4
      - name: Bajar datos oficiales del BCRP
        run: python3 .github/guias/datos.py
      - name: Rehacer guías y publicar las que tocan hoy
        run: python3 .github/guias/generar.py
      - name: Revisar que las fuentes citadas abran
        continue-on-error: true
        run: python3 .github/guias/generar.py --revisar-enlaces
      - name: Guardar los cambios
        run: |
          git config user.name "robot-guias"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guias sitemap.xml index.html
          git diff --cached --quiet && exit 0
          git commit -m "Robot: actualizar guías de economía"
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done
          exit 1

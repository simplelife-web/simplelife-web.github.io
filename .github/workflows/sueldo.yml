name: Robot sueldo (AFP)
on:
  workflow_dispatch:
  push:
    paths:
      - .github/robot/actualizar-afp.mjs
      - .github/workflows/sueldo.yml
jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node .github/robot/actualizar-afp.mjs

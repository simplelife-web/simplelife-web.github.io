# Robot de "¿Qué hago hoy?": cada mañana busca eventos en las páginas oficiales
# de quehagohoy/fuentes.json y actualiza quehagohoy/eventos.json. Es gratis
# (GitHub Actions en un repositorio público) y no necesitas hacer nada.
# También puedes lanzarlo a mano: pestaña Actions → "Robot ¿Qué hago hoy?" → Run workflow.
name: Robot ¿Qué hago hoy?

on:
  schedule:
    - cron: "0 11 * * *"   # todos los días a las 6:00 a. m. de Lima
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: robot-quehagohoy
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Buscar eventos en las fuentes oficiales
        run: node .github/robot/buscar-eventos.mjs
      - name: Guardar los eventos nuevos
        run: |
          git config user.name "robot-quehagohoy"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quehagohoy/eventos.json
          git diff --cached --quiet || (git commit -m "Robot: actualizar eventos de ¿Qué hago hoy?" && git push)

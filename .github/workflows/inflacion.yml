# Robot de la "Calculadora de inflación Perú": todos los días revisa en el BCRP si
# ya salió la inflación de un mes nuevo (el INEI la publica el primer día del mes
# siguiente) y actualiza inflacion/ipc.json con la fecha de revisión. Es gratis y no necesitas
# hacer nada. Para lanzarlo a mano: pestaña Actions → "Robot inflación" → Run workflow.
name: Robot inflación

on:
  schedule:
    - cron: "30 12 * * *"   # 7:30 a. m. de Lima, todos los días
  workflow_dispatch:
  push:
    paths:
      - .github/robot/actualizar-ipc.mjs
      - .github/workflows/inflacion.yml

permissions:
  contents: write

concurrency:
  group: robot-inflacion
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Descargar el IPC de Lima del BCRP
        run: node .github/robot/actualizar-ipc.mjs
      - name: Guardar los datos nuevos
        run: |
          git config user.name "robot-inflacion"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inflacion/ipc.json
          git diff --cached --quiet && exit 0
          git commit -m "Robot: revisar IPC de Lima (BCRP)"
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done
          exit 1

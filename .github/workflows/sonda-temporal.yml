name: Sonda temporal (borrar)
on:
  push:
    paths: [.github/workflows/sonda-temporal.yml]
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - name: BCRP series
        run: |
          for s in PD04640PD PD04639PD PD04638PD PD12301MD PN00026MM PN00027MM PD04650MD PD04651MD PN01273PM PN01271PM PD04709XD PD04708XD PD04704XD PD04703XD PD04705XD PN07807NM PN07816NM PN07817NM PD04721XD PD04722XD PD04725XD PN01770AM PN01728AM PN01731AM PN38063GM PN38064GM PN01652XM PN38714BM PN38723BM PN01207PM PN01287PM PN07819NM PN07818NM PD38000XD PN09816XM PN07885NM PN07836NM PN07837NM PN38035BM; do
            echo "== $s"; curl -s -A "SimplelifeBot/1.0" "https://estadisticas.bcrp.gob.pe/estadisticas/series/api/$s/json/2026-1/2026-12/esp" | head -c 700; echo; sleep 1
          done
      - name: SUNAT UIT
        run: |
          curl -sL -A "Mozilla/5.0" https://www.sunat.gob.pe/indicestasas/uit.html | iconv -f latin1 -t utf-8 | sed 's/<[^>]*>/ /g' | grep -i "20[12][0-9]" | head -30
      - name: gob.pe RMV
        run: |
          curl -sL -A "Mozilla/5.0" "https://www.gob.pe/institucion/mtpe/normas-legales" | head -c 500; echo

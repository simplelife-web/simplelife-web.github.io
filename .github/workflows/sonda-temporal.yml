name: Sonda temporal (borrar)
on:
  push:
    paths: [.github/workflows/sonda-temporal.yml]
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get install -y -qq poppler-utils >/dev/null 2>&1
          curl -sL -A "Mozilla/5.0" -o d.pdf "https://busquedas.elperuano.pe/api/archivo/file/6wU_yN6ra7nAo43VnCuccT/*/2559163-1.PDF"; pdftotext d.pdf - | tr -s '\n' ' ' | head -c 5000
          echo; python3 -c "
          import sys; sys.path.insert(0,'.github/cifras'); import rmv
          print(len(rmv.dispositivos(['20261111'])))"

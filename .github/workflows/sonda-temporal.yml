name: Sonda temporal (borrar)
on:
  push:
    paths: [.github/workflows/sonda-temporal.yml]
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          sudo apt-get install -y -qq poppler-utils >/dev/null 2>&1; pdftotext -v 2>&1 | head -1
          curl -sL -m 30 -A "Mozilla/5.0" "https://busquedas.elperuano.pe/" > b.html
          grep -o '/api/archivo/file/[^"\\]*\.pdf' b.html | sort -u
          u=$(grep -o '/api/archivo/file/[^"\\]*NL2026[^"\\]*\.pdf' b.html | head -1)
          curl -sL -m 120 -A "Mozilla/5.0" -o nl.pdf "https://busquedas.elperuano.pe$u"; pdftotext nl.pdf nl.txt; wc -l nl.txt; grep -n "DECRETO SUPREMO N" nl.txt | head -5; grep -n -i "S/ [0-9]" nl.txt | head -5
          echo "=== gob.pe 015-2026-TR"
          curl -sL -m 30 -A "Mozilla/5.0" "https://www.gob.pe/busquedas.json?contenido[]=normas&term=015-2026-TR" > g.json
          python3 -c "
          import json,re;d=json.load(open('g.json'))
          for r in (d['data']['attributes'].get('results') or [])[:5]: print(r.get('publication'), '|', r.get('url','')[:300])
          "

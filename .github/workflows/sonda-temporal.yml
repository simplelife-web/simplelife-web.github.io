name: Sonda temporal (borrar)
on:
  push:
    paths: [.github/workflows/sonda-temporal.yml]
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sL -m 30 -A "Mozilla/5.0" "https://busquedas.elperuano.pe/?fechaIni=20260928&fechaFin=20260928&tipoPublicacion=NL&ci=ONLY&start=0" > p.html
          grep -o 'totalHits.\{0,40\}' p.html | head -3
          grep -o 'href="/?[^"]*"' p.html | sort -u | head
          grep -o '.\{60\}[Ss]iguiente.\{120\}' p.html | head -2
          for q in "start=1" "page=2" "pagina=2" "p=2" "start=2"; do echo "$q: $(curl -sL -m 30 -A 'Mozilla/5.0' "https://busquedas.elperuano.pe/?fechaIni=20260928&fechaFin=20260928&tipoPublicacion=NL&ci=ONLY&$q" | grep -o '[0-9]*-[0-9]\.PDF' | sort -u | head -3 | tr '\n' ' ')"; done

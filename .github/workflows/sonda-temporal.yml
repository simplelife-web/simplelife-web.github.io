name: Sonda temporal (borrar)
on:
  push:
    paths: [.github/workflows/sonda-temporal.yml, .github/cifras/rmv.py]
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          sudo apt-get install -y -qq poppler-utils >/dev/null 2>&1
          curl -sL -m 30 -A "Mozilla/5.0" "https://www.gob.pe/institucion/mtpe/normas-legales/8691054-015-2026-tr" > p.html
          grep -o 'href="[^"]*\.pdf[^"]*"' p.html | head -5
          u=$(grep -o 'https://[^"]*\.pdf[^"]*' p.html | head -1); echo "PDF: $u"
          curl -sL -m 120 -A "Mozilla/5.0" -o ds.pdf "$u"; ls -la ds.pdf
          pdftotext ds.pdf - | grep -i -A3 "nima vital" | head -30
          echo "=== prueba con 1130"; python3 .github/cifras/rmv.py ds.pdf 1130
          echo "=== cuadernillos hoy"; python3 -c "
          import sys; sys.path.insert(0,'.github/cifras'); import rmv
          print(rmv.cuadernillos()); print(rmv.revisar(1230, []))"

name: Sonda temporal (borrar)
on:
  push:
    paths: [.github/workflows/sonda-temporal.yml]
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          which pdftotext; pdftotext -v 2>&1 | head -1
          curl -sL -m 30 -A "Mozilla/5.0" "https://busquedas.elperuano.pe/" > b.html
          for js in $(grep -o '/_next/static/[^"]*\.js' b.html | sort -u); do curl -sL -m 30 "https://busquedas.elperuano.pe$js" | grep -o '"/api/[^"]*"\|`/api/[^`]*`' ; done | sort -u | head -30
          echo "=== NL de hoy"; u=$(grep -o '/api/archivo/file/[^"\\]*NL2026[^"\\]*\.pdf' b.html | head -1); echo $u
          curl -sL -m 120 -A "Mozilla/5.0" -o nl.pdf "https://busquedas.elperuano.pe$u"; ls -la nl.pdf; pdftotext -layout nl.pdf nl.txt; wc -l nl.txt; grep -n -i "DECRETO SUPREMO N" nl.txt | head -15
          echo "=== probar DS 015-2026-TR (busqueda)"
          for q in "api/search?q=remuneracion%20minima%20vital" "api/busqueda?query=remuneracion%20minima%20vital" "api/normas?q=remuneracion"; do curl -sL -m 30 -o r.txt -w "$q %{http_code} %{content_type}\n" "https://busquedas.elperuano.pe/$q"; head -c 300 r.txt; echo; done

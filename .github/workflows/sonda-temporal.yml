name: Sonda temporal (borrar)
on:
  push:
    paths: [.github/workflows/sonda-temporal.yml]
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get install -y -qq poppler-utils >/dev/null 2>&1
          python3 .github/cifras/rmv.py 1130 20260928
          python3 .github/cifras/rmv.py 1230 20261110 20261111

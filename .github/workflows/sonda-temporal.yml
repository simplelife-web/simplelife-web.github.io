name: Sonda temporal (borrar)
on:
  push:
    paths: [.github/workflows/sonda-temporal.yml]
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - name: BCRP series
        shell: python3 {0}
        run: |
          import json, urllib.request, time
          S = "PD04640PD PD04639PD PD04638PD PD04637PD PD12301MD PD04650MD PD04709XD PD04708XD PD04704XD PD04701XD PD04705XD PD04692MD".split()
          for s in S:
              try:
                  r = urllib.request.urlopen(urllib.request.Request(f"https://estadisticas.bcrp.gob.pe/estadisticas/series/api/{s}/json/2026-10-01/2026-11-11/esp", headers={"User-Agent":"SimplelifeBot/1.0"}), timeout=60)
                  d = json.loads(r.read().decode("utf-8-sig"))
                  nom = d["config"]["series"][0]["name"]
                  ps = [(p["name"], p["values"][0]) for p in d.get("periods", []) if p["values"][0] not in ("n.d.", "")]
                  print(s, "|", d["config"]["title"], "|", nom, "|", ps[-3:] if ps else "VACIA", "| n=", len(d.get("periods", [])))
              except Exception as e:
                  print(s, "ERROR", e)
              time.sleep(0.5)
      - name: SUNAT UIT
        run: |
          curl -sL -A "Mozilla/5.0" https://www.sunat.gob.pe/indicestasas/uit.html | iconv -f latin1 -t utf-8 > uit.html; wc -c uit.html; grep -n -i "2026\|2025\|5 500\|5,500\|5500" uit.html | head -20; grep -o 'src="[^"]*"' uit.html | head
      - name: gob.pe
        run: |
          curl -sL -o /dev/null -w "%{http_code}\n" -A "Mozilla/5.0" "https://www.gob.pe/institucion/mtpe/normas-legales"
          curl -sL -A "Mozilla/5.0" "https://www.gob.pe/busquedas.json?contenido[]=normas&institucion[]=mtpe&term=remuneracion+minima" | head -c 800; echo

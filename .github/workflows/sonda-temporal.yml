name: Sonda temporal (borrar)
on:
  push:
    paths: [.github/workflows/sonda-temporal.yml]
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get install -y -qq poppler-utils >/dev/null 2>&1
          python3 -c "
          import sys; sys.path.insert(0,'.github/cifras'); import rmv
          fs=['20260926','20260927','20260928','20260929']
          print(rmv.cuadernillos(fs)); print(rmv.revisar(1130, [], fs))"
